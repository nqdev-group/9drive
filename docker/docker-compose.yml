# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
# 9Drive - Self-hosted, open-source, and privacy-focused router for your applications.
# -----------------------------------------
# A self-hosted, open-source, and privacy-focused router for your applications.
# GitHub: https://github.com/nqdev-group/9drive
# -----------------------------------------
# START: docker-compose up -d --build --force-recreate --remove-orphans
# STOP: docker-compose down -v --remove-orphans
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

services:

  9drive_backend:
    image: ghcr.io/nqdev-group/9drive-backend:1.0.1-manual
    container_name: 9drive-backend-10024
    restart: unless-stopped
    # network_mode: host
    ports:
      - "10024:4000"
    environment:
      TZ: Asia/Ho_Chi_Minh
      DATABASE_URL: mysql://${MYSQL_USER:-9drive}:${MYSQL_PASSWORD:-change-this-database-password}@mysql:3306/${MYSQL_DATABASE:-9drive}
      APP_PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-this-jwt-secret-at-least-32-chars}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-change-this-encryption-key-32bytes!}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-3600}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      MAX_UPLOAD_BYTES: 5368709120
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:4000/connected-accounts/google/callback}
    env_file:
      - .env
    volumes:
      - ./logs/backend:/app/logs
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway" # Để kết nối đến localhost của host từ container
      - "minipc-quyit:192.168.1.200"
    ulimits:
      nproc: 65536 # Giới hạn số lượng tiến trình con mà container có thể tạo ra
      nofile: # Giới hạn số lượng file mà container có thể mở cùng lúc
        soft: 102400
        hard: 102400
    deploy:
      resources:
        limits:
          cpus: "0.50" # Giới hạn 80% CPU
          memory: "512G" # Giới hạn 3.2GB RAM (80% của 4GB)
        reservations:
          memory: "256M" # Đảm bảo container có ít nhất 256MB RAM

  9drive_frontend:
    image: ghcr.io/nqdev-group/9drive-frontend:1.0.1-manual
    container_name: 9drive-frontend-10025
    restart: unless-stopped
    # network_mode: host
    ports:
      - "5173:80"
    environment:
      TZ: Asia/Ho_Chi_Minh
    env_file:
      - .env
    depends_on:
      - 9drive_backend
    # volumes:
    #   - ./data/9router-data:/app/data
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway" # Để kết nối đến localhost của host từ container
      - "minipc-quyit:192.168.1.200"
    ulimits:
      nproc: 65536 # Giới hạn số lượng tiến trình con mà container có thể tạo ra
      nofile: # Giới hạn số lượng file mà container có thể mở cùng lúc
        soft: 102400
        hard: 102400
    deploy:
      resources:
        limits:
          cpus: "0.50" # Giới hạn 80% CPU
          memory: "512G" # Giới hạn 3.2GB RAM (80% của 4GB)
        reservations:
          memory: "256M" # Đảm bảo container có ít nhất 256MB RAM

