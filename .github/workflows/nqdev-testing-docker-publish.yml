name: Testing - 9Drive Build Docker Images
run-name: "#${{ github.run_number }} Build Docker Images (testing) on ${{ github.event_name }} by @${{ github.actor }}"

on:
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: "1.0.${{ github.run_number }}" # ✅ Default nếu không đọc từ file VERSION
      GHCR_IMAGE: ghcr.io/${{ github.repository }}-backend-testing

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Set VERSION
        uses: ./.github/actions/set-version

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ env.VERSION }}-testing

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcachetesting
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcachetesting,mode=max
          platforms: linux/amd64
          provenance: false
          sbom: false

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: "1.0.${{ github.run_number }}" # ✅ Default nếu không đọc từ file VERSION
      GHCR_IMAGE: ghcr.io/${{ github.repository }}-frontend-testing

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Set VERSION
        uses: ./.github/actions/set-version

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ env.VERSION }}-testing

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:4000' }}
            VITE_RECAPTCHA_SITE_KEY=${{ vars.VITE_RECAPTCHA_SITE_KEY }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcachetesting
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcachetesting,mode=max
          platforms: linux/amd64
          provenance: false
          sbom: false
